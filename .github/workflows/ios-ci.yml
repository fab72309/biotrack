name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: List available simulators
        run: xcrun simctl list devices

      - name: List project schemes
        run: xcodebuild -list -project BioTrack.xcodeproj

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -project BioTrack.xcodeproj \
            -scheme BioTrack \
            -resolvePackageDependencies

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project BioTrack.xcodeproj \
            -scheme BioTrack \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build | tee build.log

      - name: Test correlation engine
        run: |
          set -o pipefail
          test_device_id="$(
            xcrun simctl list devices available --json |
              jq -r '
                .devices
                | to_entries[]
                | .value[]
                | select(.name | startswith("iPhone"))
                | select(.isAvailable == true)
                | .udid
              ' |
              head -n 1
          )"
          if [[ -z "$test_device_id" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          xcodebuild \
            -project BioTrack.xcodeproj \
            -scheme BioTrack \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$test_device_id" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            test | tee test.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: |
            build.log
            test.log
