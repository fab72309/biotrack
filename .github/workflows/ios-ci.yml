name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4 if available
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcode-select -p

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project BioTrack.xcodeproj

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -project BioTrack.xcodeproj \
            -scheme BioTrack \
            -resolvePackageDependencies

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project BioTrack.xcodeproj \
            -scheme BioTrack \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
