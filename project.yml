name: BioTrack
options:
  bundleIdPrefix: com.fabienlopes
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BioTrack:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: BioTrack
        excludes:
          - PrivacyPolicy.md
    info:
      path: BioTrack/Info.plist
      properties:
        CFBundleDisplayName: BioTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIUserInterfaceStyle: Automatic
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "BioTrack lit vos données Santé (sommeil, pas, poids, fréquence cardiaque au repos, HRV) pour pré-remplir vos métriques."
        NSHealthUpdateUsageDescription: "BioTrack ne modifie aucune donnée Santé. Cette déclaration est requise par HealthKit ; l’app utilise Santé uniquement en lecture, avec votre accord, pour pré-remplir localement vos métriques."
        CFBundleURLTypes:
          - CFBundleURLName: com.fabienlopes.biotrack
            CFBundleURLSchemes:
              - biotrack
    entitlements:
      path: BioTrack/BioTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.fabienlopes.biotrack
    dependencies:
      - target: BioTrackWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabienlopes.biotrack
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.2.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  BioTrackWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BioTrackWidgetExtension
      - path: BioTrack/Models
      - path: BioTrack/Shared
    info:
      path: BioTrackWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: BioTrack Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: com.fabienlopes.biotrack
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BioTrackWidgetExtension/BioTrackWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fabienlopes.biotrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabienlopes.biotrack.widget
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 1.2.0
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework
  BioTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: BioTrackTests
    dependencies:
      - target: BioTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabienlopes.biotrack.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BioTrack:
    build:
      targets:
        BioTrack: all
        BioTrackWidgetExtension: all
        BioTrackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BioTrackTests
